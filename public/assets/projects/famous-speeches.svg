<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A bold cartoon microphone surrounded by speech bubbles">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.6" fill="#1e2350" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#f6eedd"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <!-- sunburst -->
  <g opacity="0.95">
    <circle cx="600" cy="400" r="290" fill="#ffc21a"/>
    <g stroke="#1e2350" stroke-width="10" stroke-linecap="round">
      <line x1="600" y1="72" x2="600" y2="128"/>
      <line x1="600" y1="672" x2="600" y2="728"/>
      <line x1="272" y1="400" x2="328" y2="400"/>
      <line x1="872" y1="400" x2="928" y2="400"/>
      <line x1="368" y1="168" x2="408" y2="208"/>
      <line x1="792" y1="592" x2="832" y2="632"/>
      <line x1="832" y1="168" x2="792" y2="208"/>
      <line x1="408" y1="592" x2="368" y2="632"/>
    </g>
  </g>

  <!-- speech bubbles -->
  <g stroke="#1e2350" stroke-width="12" stroke-linejoin="round">
    <g>
      <rect x="92" y="150" width="250" height="150" rx="42" fill="#3fb03c"/>
      <path d="M150 298 L132 366 L226 300 Z" fill="#3fb03c"/>
      <path d="M142 198 h150 M142 238 h110" stroke="#f6eedd" stroke-width="16" stroke-linecap="round" fill="none"/>
    </g>
    <g>
      <rect x="856" y="128" width="252" height="156" rx="42" fill="#f26b1d"/>
      <path d="M1050 282 L1072 348 L980 284 Z" fill="#f26b1d"/>
      <path d="M906 178 h152 M906 220 h100" stroke="#f6eedd" stroke-width="16" stroke-linecap="round" fill="none"/>
    </g>
    <g>
      <rect x="852" y="512" width="262" height="142" rx="40" fill="#1fa3e5"/>
      <path d="M902 652 L884 716 L978 654 Z" fill="#1fa3e5"/>
      <path d="M902 560 h160 M902 600 h108" stroke="#f6eedd" stroke-width="15" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- microphone -->
  <g stroke="#1e2350" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- stand -->
    <path d="M600 558 v92" fill="none" stroke-width="18"/>
    <path d="M508 700 q92 -40 184 0" fill="none" stroke-width="18"/>
    <path d="M456 400 v70 a144 144 0 0 0 288 0 v-70" fill="none" stroke-width="20"/>
    <!-- body -->
    <rect x="484" y="176" width="232" height="336" rx="116" fill="#1e2350"/>
    <rect x="512" y="204" width="176" height="184" rx="88" fill="#f6eedd"/>
    <g stroke="#1e2350" stroke-width="8" opacity="0.85">
      <line x1="534" y1="248" x2="666" y2="248"/>
      <line x1="528" y1="286" x2="672" y2="286"/>
      <line x1="534" y1="324" x2="666" y2="324"/>
      <line x1="548" y1="362" x2="652" y2="362"/>
    </g>
    <!-- band -->
    <rect x="484" y="408" width="232" height="58" fill="#f26b1d"/>
    <!-- highlight -->
    <path d="M520 200 q-24 52 -16 120" fill="none" stroke="#f6eedd" stroke-width="12" opacity="0.7"/>
  </g>

  <!-- sparkles -->
  <g fill="#1e2350">
    <path d="M180 470 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14 z"/>
    <path d="M1010 480 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z"/>
  </g>
  <g fill="#3fb03c">
    <path d="M240 590 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z"/>
  </g>
  <g fill="#f26b1d">
    <path d="M770 690 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12 z"/>
    <path d="M330 96 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12 z"/>
  </g>

  <!-- lightning -->
  <path d="M790 350 l-52 82 h44 l-28 74 78 -100 h-48 l34 -56 z" fill="#3fb03c" stroke="#1e2350" stroke-width="12" stroke-linejoin="round"/>
</svg>
